<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロトカロトロト</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body { background: #780d28; color: #fff; font-family: system-ui, sans-serif; font-size: clamp(12px, 1.05vw, 16px); line-height: 1.35; }
/* ヘッダーを除く高さを2:1、上段の横幅を2:1で配分する。 */
main {
  width: 100%; height: 100vh; height: 100dvh;
  padding: clamp(6px, 1vw, 16px);
  display: grid; grid-template-rows: auto minmax(0, 2fr) minmax(0, 1fr);
  gap: clamp(6px, 1vw, 14px);
}
h1, h2, p { margin: 0; }
h1 { font-size: 1.15em; }
h2 { font-size: 1.1em; }
.page-header, .speed-controls, .reset-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .4em .7em; }
.page-header span { font-size: .9em; }
.workspace { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: clamp(6px, 1vw, 14px); }
.workspace, .field-panel, .controls, .graph-panel { min-width: 0; min-height: 0; }
.field-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .25em; }
.simulation-status { font-weight: bold; overflow-wrap: anywhere; }
.field-stage { position: relative; min-width: 0; min-height: 0; }
/* Canvasの固有サイズをレイアウト計算から切り離し、余白内に収める。 */
#field { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.legend, .note { font-size: .9em; }
.controls { padding: clamp(6px, .8vw, 12px); border-radius: 8px; background: #edf5ff; color: #172b43; overflow: auto; }
.species-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .8em; margin-top: .35em; }
fieldset { border: 0; padding: 0; margin: 0 0 .4em; min-width: 0; }
legend { font-weight: bold; padding: 0; margin-bottom: .3em; }
label { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .15em .4em; font-size: .9em; }
output { font-variant-numeric: tabular-nums; }
input[type="range"] { display: block; width: 100%; height: clamp(18px, 3vh, 28px); margin: 0 0 .2em; accent-color: #245ba5; cursor: pointer; }
button { font: inherit; padding: .3em .65em; min-height: 28px; border: 1px solid #547293; border-radius: 5px; color: #172b43; background: #fff; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 3px solid #245ba5; outline-offset: 2px; }
.speed-controls button[aria-pressed="true"], #reset-all { background: #193f72; color: white; }
.note { margin-top: .35em; }
#settings-status:empty { display: none; }
.graph-panel { padding: clamp(5px, .65vw, 10px); background: #fff0f4; color: #502034; border-radius: 8px; display: flex; flex-direction: column; gap: .15em; overflow: auto; }
.graph-toolbar, .equation-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .2em .8em; font-size: .85em; }
#graph-time { margin-left: auto; font-variant-numeric: tabular-nums; }
.equation-controls label { gap: .3em; font-size: inherit; }
.equation-controls input { width: 5em; min-width: 0; font: inherit; padding: .1em; }
.equation-controls button { min-height: 24px; padding: .1em .5em; }
.graph-note { font-size: .8em; }
.plot-stage { position: relative; flex: 1 0 80px; min-width: 0; min-height: 80px; }
#population-graph { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
/* スマートフォン縦画面は、文字と操作を保つため縦積みにする。 */
@media (max-width: 600px) {
  main { height: auto; min-height: 100vh; grid-template-rows: auto auto auto; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .field-stage { height: 55vw; }
  .controls { overflow: visible; }
  .graph-panel { min-height: 280px; overflow: visible; }
  input[type="range"] { height: 28px; }
}
</style>
</head>
<body>
<main>
<header class="page-header"><h1>ロトカロトロト</h1><button type="button" id="restart-simulation">リスタート</button><span>現在の設定を保って最初から</span><div class="speed-controls" role="group" aria-label="シミュレーション速度"><span>速度</span><button type="button" data-simulation-speed="1" aria-pressed="true">×1</button><button type="button" data-simulation-speed="3" aria-pressed="false">×3</button><button type="button" data-simulation-speed="5" aria-pressed="false">×5</button></div></header>
<div class="workspace">
<section class="field-panel" aria-label="箱庭">
<p id="simulation-status" class="simulation-status" role="status">シミュレーションを読み込み中…</p>
<div class="field-stage"><canvas id="field" width="800" height="600" role="img" aria-label="草食動物と捕食者のシミュレーション">草食動物と捕食者のシミュレーション</canvas></div>
<p class="legend">白い丸：草食動物 ／ 赤い丸：捕食者 ／ 緑の葉：草</p>
</section>
<aside class="controls" aria-labelledby="controls-title">
<h2 id="controls-title">操作盤</h2>
<div class="species-controls"><fieldset><legend>草食動物</legend>
<label for="herbivore-speedMultiplier">移動速度<output id="herbivore-speedMultiplier-value" for="herbivore-speedMultiplier">1.00倍</output></label>
<input id="herbivore-speedMultiplier" data-species="herbivore" data-setting="speedMultiplier" type="range" min="0" max="3" step="0.05" value="1" aria-describedby="herbivore-speedMultiplier-value">
<label for="herbivore-reproductionMultiplier">繁殖倍率<output id="herbivore-reproductionMultiplier-value" for="herbivore-reproductionMultiplier">0.10倍</output></label>
<input id="herbivore-reproductionMultiplier" data-species="herbivore" data-setting="reproductionMultiplier" type="range" min="0" max="3" step="0.05" value="0.1" aria-describedby="herbivore-reproductionMultiplier-value">
<label for="herbivore-energyUseMultiplier">体力消費<output id="herbivore-energyUseMultiplier-value" for="herbivore-energyUseMultiplier">0.25倍</output></label>
<input id="herbivore-energyUseMultiplier" data-species="herbivore" data-setting="energyUseMultiplier" type="range" min="0" max="3" step="0.05" value="0.25" aria-describedby="herbivore-energyUseMultiplier-value">
<label for="herbivore-detectionDistance">探索距離<output id="herbivore-detectionDistance-value" for="herbivore-detectionDistance">200px</output></label>
<input id="herbivore-detectionDistance" data-species="herbivore" data-setting="detectionDistance" type="range" min="0" max="400" step="10" value="200" aria-describedby="herbivore-detectionDistance-value">
</fieldset>
<fieldset><legend>捕食者</legend>
<label for="predator-speedMultiplier">移動速度<output id="predator-speedMultiplier-value" for="predator-speedMultiplier">1.00倍</output></label>
<input id="predator-speedMultiplier" data-species="predator" data-setting="speedMultiplier" type="range" min="0" max="3" step="0.05" value="1" aria-describedby="predator-speedMultiplier-value">
<label for="predator-reproductionMultiplier">繁殖倍率<output id="predator-reproductionMultiplier-value" for="predator-reproductionMultiplier">0.05倍</output></label>
<input id="predator-reproductionMultiplier" data-species="predator" data-setting="reproductionMultiplier" type="range" min="0" max="3" step="0.05" value="0.05" aria-describedby="predator-reproductionMultiplier-value">
<label for="predator-energyUseMultiplier">体力消費<output id="predator-energyUseMultiplier-value" for="predator-energyUseMultiplier">0.20倍</output></label>
<input id="predator-energyUseMultiplier" data-species="predator" data-setting="energyUseMultiplier" type="range" min="0" max="3" step="0.05" value="0.2" aria-describedby="predator-energyUseMultiplier-value">
<label for="predator-detectionDistance">探索距離<output id="predator-detectionDistance-value" for="predator-detectionDistance">80px</output></label>
<input id="predator-detectionDistance" data-species="predator" data-setting="detectionDistance" type="range" min="0" max="400" step="10" value="80" aria-describedby="predator-detectionDistance-value">
</fieldset>

</div><div class="reset-actions"><button type="button" id="reset-settings">能力設定を戻す</button><button type="button" id="reset-all">全リセット</button></div>
<p class="note">倍率は即時反映。捕食者の基準速度は草食動物の1.5倍。</p>
<p id="settings-status" class="note" role="status"></p>
</aside>
</div>
<section class="graph-panel" aria-labelledby="graph-title">
<h2 id="graph-title">個体数グラフ</h2>
<div class="graph-toolbar">
<span>青：草食動物 ／ 赤：捕食者　実線：箱庭 ／ 破線：方程式</span>
<span id="graph-time">0秒</span></div>
<div class="equation-controls">
<label>α <input id="lv-alpha" type="number" min="0" max="1" step="0.01" value="0.06" aria-label="被食者の増殖率 alpha"></label>
<label>β <input id="lv-beta" type="number" min="0" max="1" step="0.001" value="0.02" aria-label="捕食係数 beta"></label>
<label>δ <input id="lv-delta" type="number" min="0" max="1" step="0.001" value="0.01" aria-label="捕食者の増殖係数 delta"></label>
<label>γ <input id="lv-gamma" type="number" min="0" max="1" step="0.01" value="0.12" aria-label="捕食者の死亡率 gamma"></label>
<button id="restart-comparison" type="button">現在数から比較し直す</button>
</div>
<p class="graph-note">dx/dt = αx − βxy ／ dy/dt = δxy − γy（x：草食動物、y：捕食者）</p>
<p class="graph-note" id="graph-status" role="status">係数は比較用の仮設定です。箱庭の倍率とは独立で、草・空腹・追跡は式に含みません。</p>
<div class="plot-stage"><canvas id="population-graph" role="img" aria-label="箱庭とロトカ・ヴォルテラ方程式の個体数推移"></canvas></div>
</section>
</main>
<noscript>このシミュレーターを動かすには、ブラウザのJavaScriptを有効にしてください。</noscript>
<script src="script.js"></script>
</body>
</html>
